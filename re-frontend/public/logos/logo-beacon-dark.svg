<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 60" width="300" height="60" fill="none" role="img" aria-labelledby="bd-title">
  <title id="bd-title">Prison Gihon Cadastral Beacon Logo (Dark Mode / Inverted)</title>
  <defs>
    <linearGradient id="bdTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="bdLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0B3C68" />
    </linearGradient>
    <linearGradient id="bdRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1A56DB" />
    </linearGradient>
    <linearGradient id="bdEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- LOGO MARK -->
  <g transform="translate(6, 4) scale(0.8125)">
    <path d="M32 7 L52 18 L32 29 L12 18 Z" fill="url(#bdTop)" stroke="#93C5FD" stroke-width="0.8" stroke-opacity="0.5" />
    <path d="M32 12 L39 18 L32 24 L25 18 Z" fill="url(#bdEmerald)" stroke="#FFFFFF" stroke-width="1.2" />
    <circle cx="32" cy="18" r="1.5" fill="#FFFFFF" />
    <path d="M12 21.5 L30 31.8 V55.5 L12 45 Z" fill="url(#bdLeft)" stroke="#60A5FA" stroke-width="0.8" stroke-opacity="0.3" />
    <path d="M18 28.5 L24 32 V47.5 L18 44 Z" fill="#FFFFFF" opacity="0.25" />
    <path d="M34 31.8 L52 21.5 V45 L34 55.5 Z" fill="url(#bdRight)" stroke="#60A5FA" stroke-width="0.8" stroke-opacity="0.3" />
    <path d="M40 32 L46 28.5 V44 L40 47.5 Z" fill="#FFFFFF" opacity="0.3" />
    <line x1="32" y1="29" x2="32" y2="57" stroke="#60A5FA" stroke-width="1.2" opacity="0.4" />
  </g>

  <!-- LOGOTYPE (Inverted White & Sky/Cobalt) -->
  <g transform="translate(68, 0)">
    <text x="0" y="32" font-family="'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="21" letter-spacing="-0.025em">
