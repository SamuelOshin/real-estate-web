<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none" role="img" aria-labelledby="mono-title mono-desc">
  <title id="mono-title">Prison Gihon Interlocking Monogram</title>
  <desc id="mono-desc">Modern architectural monogram intertwining P and G into a sovereign gateway</desc>
  <defs>
    <linearGradient id="mNavy" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B3C68" />
      <stop offset="100%" stop-color="#06223D" />
    </linearGradient>
    <linearGradient id="mCobalt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1A56DB" />
    </linearGradient>
    <linearGradient id="mEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- P PILLAR & UPPER ARCH (Navy) -->
  <path d="M12 10 H34 C43 10 50 16.5 50 25 C50 33.5 43 40 34 40 H24 V54 H12 V10 Z M24 20 V30 H33 C36 30 38.5 28 38.5 25 C38.5 22 36 20 33 20 H24 Z" 
        fill="url(#mNavy)" />

  <!-- G FOUNDATION & LOWER PORTAL (Cobalt) -->
  <path d="M26 36 H38 V44 H28 C26.5 44 25.5 45.2 25.5 46.5 C25.5 47.8 26.5 49 28 49 H44 C47.3 49 50 46.3 50 43 V34 H54 V43 C54 48.5 49.5 53 44 53 H28 C24 53 20.5 50.5 19.5 46.8 L26 36 Z" 
        fill="url(#mCobalt)" />

  <!-- VERIFICATION GEM (Emerald Diamond Accent in Archway) -->
  <path d="M34 16 L38.5 21 L34 26 L29.5 21 Z" fill="url(#mEmerald)" />
  <circle cx="34" cy="21" r="1.2" fill="#FFFFFF" />

  <!-- Baseline Cadastral Horizon Bar -->
  <rect x="12" y="52" width="42" height="3" rx="1.5" fill="#1A56DB" opacity="0.3" />
</svg>
